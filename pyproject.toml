[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpop"
version = "1.1.0"
description = "Sticky desktop notification center for AI coding agents and scripts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "junglin830"}]
keywords = ["claude-code","codex","notifications"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/junglin830/deskpop"

[project.scripts]
deskpop = "deskpop:main"

[tool.setuptools]
py-modules = ["deskpop"]
